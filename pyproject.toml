[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seoulonline-schedule"
version = "0.1.0"
description = "서울온라인학교 참여학교 학사일정 조회"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
]

[project.scripts]
seoulonline-schedule = "seoulonline_schedule.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["seoulonline_schedule*"]
